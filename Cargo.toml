[workspace]
resolver = "3"
members = [
    "crates/kairos-core",
    "crates/kairos-app",
    "spikes/so-timestamp",
    "spikes/cpal-hosttime",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
kairos-core = { path = "crates/kairos-core" }
libc = "0.2"
mach2 = "0.7"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1"
notify = "8"
