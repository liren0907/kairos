[workspace]
resolver = "3"
members = [
    "crates/kairos-core",
    "crates/kairos-app",
    "spikes/so-timestamp",
    "spikes/cpal-hosttime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
kairos-core = { path = "crates/kairos-core" }
libc = "0.2"
mach2 = "0.7"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1"
notify = "8"
cpal = "0.16"
objc2-core-audio = "0.3"
objc2-metal = "0.3"

# 發佈用：去符號、thin LTO；backtrace 沒了但 binary 小一半。
[profile.release]
strip = true
lto = "thin"
