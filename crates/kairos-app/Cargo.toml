[package]
name = "kairos-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "kairos 的 macOS 殼：面板、選單列、畫面與聲音"

[[bin]]
name = "kairos"
path = "src/main.rs"

[dependencies]
kairos-core.workspace = true
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
serde.workspace = true
toml.workspace = true
notify.workspace = true
cpal.workspace = true

[dependencies.objc2-core-audio]
workspace = true
features = ["AudioHardware"]

[dependencies.objc2-core-foundation]
workspace = true
features = ["CFCGTypes"]

[dependencies.objc2-core-graphics]
workspace = true
features = ["CGColor"]

[dependencies.objc2-foundation]
workspace = true
features = [
    "NSAttributedString",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSNotification",
    "NSObjCRuntime",
    "NSObject",
    "NSOperation",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "block2",
    "objc2-core-foundation",
]

[dependencies.objc2-quartz-core]
workspace = true
features = [
    "CADisplayLink",
    "CAFrameRateRange",
    "CAGradientLayer",
    "CALayer",
    "CAMediaTiming",
    "CAMetalLayer",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-metal",
]

[dependencies.objc2-metal]
workspace = true
features = [
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
    "block2",
    "objc2-core-foundation",
]

[dependencies.objc2-app-kit]
workspace = true
features = [
    "NSAccessibility",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSColorSpace",
    "NSColorWell",
    "NSControl",
    "NSDatePicker",
    "NSDatePickerCell",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSFontManager",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPopUpButton",
    "NSPopUpButtonCell",
    "NSResponder",
    "NSScreen",
    "NSSlider",
    "NSSliderCell",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStepper",
    "NSStringDrawing",
    "NSTabView",
    "NSTabViewItem",
    "NSText",
    "NSTextField",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
]
